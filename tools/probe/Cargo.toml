[package]
name = "diary_probe"
description = "M0 技术验证脚手架：中文短词检索、本地向量模型、插件运行时候选。不是产品代码。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["search", "plugin"]
# 检索实验需要 bundled SQLite（C 代码）与 jieba 词典。
search = ["dep:rusqlite", "dep:jieba-rs"]
# 插件实验是纯 Rust，可以只用它做 Android 交叉编译检查，不必拉进 C 工具链。
plugin = ["dep:wasmi", "dep:wat"]
# 向量模型验证要下载 ONNX Runtime 与权重，不进 CI。
# 用 load-dynamic：运行时加载 libonnxruntime.so，避免 ort-sys 的下载器把
# openssl 拉进构建图（本机没有 OpenSSL 开发头），也更接近真实打包方式。
model = ["dep:ort", "dep:tokenizers"]

[dependencies]
anyhow = "1.0.104"
# 只在 Android 上直接用它调 `_exit`（跳过 libonnxruntime 那串会 abort 的退出收尾）。
libc = "0.2"
jieba-rs = { version = "0.11.0", optional = true }
ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic", "std"], optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"], optional = true }
wasmi = { version = "2.0.0", optional = true }
wat = { version = "1.259.0", optional = true }
