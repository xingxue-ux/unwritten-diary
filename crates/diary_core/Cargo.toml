[package]
name = "diary_core"
description = "「不写日记」设备内本地核心：资料库、记录与持久化。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rusqlite.workspace = true
chrono.workspace = true
uuid.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
encoding_rs.workspace = true
chardetng.workspace = true
zip.workspace = true
quick-xml.workspace = true
pdf-extract.workspace = true
jieba-rs.workspace = true
ureq.workspace = true
# 本地向量模型（B3c-2）：bge-small-zh-v1.5 ONNX + 分词器。
#
# 与探针同一个版本、同一套特性：`load-dynamic` 让 ONNX Runtime 在**运行时**才加载，
# 构建期不下载二进制、不链接 .so——所以没有模型、没有 ORT 的 CI 机器照样能编过。
# 依赖本身是**非可选**的：真实实现要参与 workspace 的 clippy/test 编译，否则
# 「CI 里能编过」就成了空话（CI 不跑它，只跑注入 stub 的换代逻辑）。
ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic", "std"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
# 插件代码沙箱（#88，B6）：纯 Rust 的 WebAssembly 解释器。
#
# 选 `wasmi` 而不是 `wasmtime`：wasmi 不依赖 Cranelift/JIT、不带原生库，交叉编译到
# Android/Windows 与别的依赖一样只有 Rust 代码；许可证 MIT/Apache-2.0；默认特性里
# 的 `wat` 与 `memory64` 对产品路径没有用，这里关掉，只保留 `std`/`validate`/
# `auto-dispatch`。指令预算用 fuel，线性内存上限用 `StoreLimits`，详见
# `docs/architecture/m4-插件SDK与宿主.md`。
wasmi = { version = "2.0.0", default-features = false, features = ["std", "validate", "auto-dispatch"] }

# 本地转写引擎（#91）：**运行时**加载 sherpa-onnx 的 C API 动态库。
#
# 与 `ort` 的 `load-dynamic` 同一个理由：构建期不链接、不下载任何原生二进制，
# 所以没有引擎库、没有模型的 CI 机器照样编得过、测得过（真引擎那一条是
# `#[ignore]` 的手动量测）。许可证：libloading 是 ISC（宽松，随包无附加义务）。
libloading = "0.9"

[features]
# AI 质量集的**判定器**（issue #93，B4b-ai-quality）。默认不开：判定器不是产品代码，
# 产品路径一个字节都不该为它变大。`cargo test -p diary_core`（dev-dependencies 生效时
# 测试自带 `cfg(test)`）与 `tools/probe` 显式打开它。
ai-quality = []

[dev-dependencies]
tempfile = "3"
# 实测脚本要直接看 EXPLAIN QUERY PLAN：核心不暴露连接，测试自己开一个只读连接。
rusqlite.workspace = true
sha2.workspace = true
zip.workspace = true
encoding_rs.workspace = true
# B7 的备份测试要**手工伪造**损坏 / 越界 / 不兼容的备份包：读清单、改字段、重写 zip。
serde_json.workspace = true
# #88 的插件测试要现场把 WAT 编成 Wasm（产品路径不需要 wat）。
wat = "1.259"