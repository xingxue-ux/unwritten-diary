[package]
name = "diary_bridge"
description = "「不写日记」对 Flutter 的薄接口与生成入口。M0 阶段只验证调用链。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# cdylib 给两端加载，staticlib 备用于不支持的加载方式，rlib 给测试用。
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge.workspace = true
diary_core = { path = "../diary_core" }
chrono.workspace = true
# flutter_rust_bridge 的宏会注入 `#[cfg(frb_expand)]`，在这里声明一下，
# 否则 clippy 的 unexpected_cfgs 会把它当成未知条件（CI 会因此失败）。
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
