[workspace]
resolver = "2"
members = ["crates/diary_bridge", "crates/diary_core", "tools/probe"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# 两端 Rust 版本不一致（WSL 1.98.1、Windows 1.94.1），以低版本为准，
# 这样同一份 Cargo.lock 在两侧都能编。见 docs/architecture/M0-环境检查.md 5.2。
rust-version = "1.94"
publish = false

[workspace.dependencies]
flutter_rust_bridge = { version = "=2.13.0", features = ["chrono", "uuid"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1", features = ["v7"] }
sha2 = "0.10"
encoding_rs = "0.8"
chardetng = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
pdf-extract = "0.12"
# 中文分词：M0 实测选定的「jieba 分词 + 2-gram 并集」需要它。
jieba-rs = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Provider 的 HTTP 客户端（B4a）。选型理由与许可证见
# docs/architecture/m3-Provider-配置与能力.md：
# - **同步**：核心整体是同步的（没有 async runtime），ureq 2.x 就是同步阻塞的，
#   与 `Core` 的调用形状一致，不引入 tokio；
# - **默认 rustls + webpki-roots**：`tls` 特性用 rustls（不用 OpenSSL，交叉编译
#   到 Android 不用额外系统库），根证书用打包进来的 Mozilla 根集合；
# - **不默认开 gzip/json/cookies**：这一片只用得上 TLS。
# 许可证：ureq 是 MIT/Apache-2.0 双许可。
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }

[profile.release]
# 移动端体积敏感：优先体积而不是极致的编译期优化。
opt-level = "z"
lto = true
codegen-units = 1
strip = true