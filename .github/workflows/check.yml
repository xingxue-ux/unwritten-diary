name: check

on:
  # 不限制 base 分支：叠在别的 PR 上的分支也要能跑检查。
  # 必过检查只对发往 main 的 PR 生效，这里放宽不会削弱门禁。
  pull_request:
  push:
    branches: [main]
  # 手动触发：只跑 check 的常规检查。ORT 构建/缓存已拆到独立 workflow
  # `.github/workflows/ohos-ort.yml`：check 的 run 级 cancel-in-progress 会连坐取消
  # 33 min 的长任务，而 actions/cache 的 post-step 不会在 cancelled 的 run 里保存。
  # 详见 docs/architecture/m6-ORT-构建与缓存.md §6。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与 Cargo.toml 里的 rust-version 下限一致：CI 必须验最老的受支持版本，
  # 用更新的 stable 会掩盖 MSRV 问题。
  RUST_VERSION: "1.94.1"
  # 与 Cargo.toml 的 `flutter_rust_bridge = "=2.13.0"`、packages/diary_bridge/pubspec.yaml
  # 以及 tools/check_codegen_freshness.sh 保持一致。版本不一致时 Rust 侧启动会直接
  # 拒绝加载（刻意的），所以 codegen 也钉死在这一个版本上。
  FRB_CODEGEN_VERSION: "2.13.0"
  DART_VERSION: "3.12.2"
  # 与 DART_VERSION 对应的 Flutter 版本（3.44.6 自带 Dart 3.12.2）。
  FLUTTER_VERSION: "3.44.6"

jobs:

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 校验关键文件、Markdown 链接、.github YAML 与共用场景
        run: |
          python3 tools/check_docs.py
          python3 tools/test_check_docs.py
          # 先跑检查器自测：证明「4 入口会红、5 入口会绿、缺 key 会红、缺壳跳过」。
          # 这样真实检查红/跳过时，都能看出脚本本身没坏。
          python3 tools/test_check_ui_parity.py
      # 诊断包隐私/确定性测试：之前只在本地手动跑，Windows 上的 time.tzset
      # 硬红一直没被 CI 发现。它只用 Python 标准库，几秒钟，跟 docs 一起跑。
      - name: 诊断包隐私与 zip 确定性测试
        run: python3 tools/diagnostics/test_no_user_content.py
      # NAPI host harness：用 stub NAPI + 假核心在普通 Linux 上编译真 shim，
      # 逐个入口注入 C++ 异常，并断言 open() 异常后句柄表为空。只需 g++。
      - name: NAPI host harness（C++ 异常路径 / 句柄表）
        run: bash apps/ohos-diary-core/tests/napi_host/run.sh
      # 跨端 IA 契约（docs/product/界面结构契约.md）的机器检查。
      #
      # 缺壳时**跳过、exit 0**：origin/main 的 Index.ets 还没有 TabContent，
      # 比较一个不存在的东西没有意义；人类日志会打 `[跳过]`，JSON 的
      # `nav.status` 是 `skipped`（不是 `passed`）。
      # 一旦 PR #150 合入、Index.ets 有 TabContent，这项自动生效：
      # 若还是 4 入口就立刻红，只红该红的那个 PR，不冻结全组 CI。
      # 不用 continue-on-error / || true 假装绿——见 CONTRIBUTING 与
      # 本文件 plugins-windows 的注释。
      - name: 校验跨端界面结构（5 入口 / 共享文案 key）
        run: |
          set +e
          python3 tools/check_ui_parity.py
          human=$?
          echo "--- check_ui_parity --json ---"
          python3 tools/check_ui_parity.py --json
          json=$?
          echo "human_exit=$human json_exit=$json"
          if [ "$human" -ne 0 ] || [ "$json" -ne 0 ]; then
            exit 1
          fi

  dart:
    name: dart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/diary_api
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 安装 Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.12.2
      - name: 安装依赖
        run: dart pub get
      - name: 静态分析
        run: dart analyze --fatal-infos
      - name: 单元测试
        run: dart test
      # F0 的 diary_mock 是纯 Dart，跟着同一个必过检查跑，不新增检查名。
      # 它和 apps/diary_app 一样是 PR #34 才引入的目录，先做存在性判断，
      # 免得本 PR 先合时这一步因为目录不存在直接失败。
      - name: diary_mock 是否存在
        id: mock
        run: |
          # 用绝对路径：这一步继承了任务级 working-directory（packages/diary_api），
          # 相对路径会去 diary_api 里找 diary_mock，永远找不到。
          if [ -f "$GITHUB_WORKSPACE/packages/diary_mock/pubspec.yaml" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::packages/diary_mock 还不存在，跳过它的静态分析与测试"
          fi
      - name: 安装依赖（diary_mock）
        if: steps.mock.outputs.present == 'true'
        working-directory: packages/diary_mock
        run: dart pub get
      - name: 静态分析（diary_mock）
        if: steps.mock.outputs.present == 'true'
        working-directory: packages/diary_mock
        run: dart analyze --fatal-infos
      - name: 单元测试（diary_mock）
        if: steps.mock.outputs.present == 'true'
        working-directory: packages/diary_mock
        run: dart test

  flutter:
    name: flutter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 不用任务级 defaults.working-directory：它同样作用于下面那条存在性判断，
    # 目录不存在时判断本身就会因为工作目录不存在而失败（第一次跑就是这样红的）。
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # apps/diary_app 是 PR #34 才引入的目录。本 PR 可能先于它合入，
      # 那时这个任务什么都不该做——但也不能静默变绿，所以打一条 notice。
      - name: 应用目录是否存在
        id: app
        run: |
          if [ -f "$GITHUB_WORKSPACE/apps/diary_app/pubspec.yaml" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/diary_app 还不存在，跳过本轮 Flutter 检查"
          fi
      - name: 安装 Flutter
        if: steps.app.outputs.present == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 安装依赖
        if: steps.app.outputs.present == 'true'
        working-directory: apps/diary_app
        run: flutter pub get
      - name: 静态分析
        if: steps.app.outputs.present == 'true'
        working-directory: apps/diary_app
        run: flutter analyze --fatal-infos
      - name: 组件测试
        if: steps.app.outputs.present == 'true'
        working-directory: apps/diary_app
        run: flutter test

  platform-host:
    name: platform-host
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/platform_host
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: 3.12.2
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: dart analyze --fatal-infos
      - run: dart test

  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 安装 Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup default "$RUST_VERSION"
          cargo --version
      - name: 静态检查
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 单元测试
        run: cargo test --workspace
      # AI 质量集的**回放**跑法：不联网（回放引擎不碰 Transport），秒级完成。
      # 它守的是「判定器 + 质量集 + 报表 + 门禁」四者对得上——回放数字**不是质量基线**，
      # 真模型基线要手动跑并如实记录（见 docs/architecture/m3-AI-质量集与评测.md）。
      #
      # **这一步的退出码就是门禁**（评审 #99）：有非预期失败项时 CLI 以非零退出码结束，
      # 这一步跟着红。未判 / 不适用不算失败；质量集里声明过的负例（tr-04 / tr-06，
      # `expect.replayVerdict = "fail"`）按预期失败，不算失败——但它们要是不红了，
      # 说明判据丢了区分度，同样红。
      - name: AI 质量集（回放，不联网）
        run: cargo run -p diary_probe -- ai-quality --json /tmp/ai-quality-replay-baseline.json

  # 窄范围的 Windows 验证：只跑插件包/沙箱集成测试，不碰 Flutter/Dart/probe，
  # 也不扩成整条矩阵。目的是直接回答评审的「Windows（core.autocrlf=true）干净
  # checkout 跑一次」：显式设 autocrlf=true 后重新落盘，再用字节断言示例包仍是
  # LF（3096/2864/607 B），最后在真实 windows-latest 上跑 plugin_test。
  #
  # 暂不加入必过检查（required checks）：先观察几轮；红了就贴原始错误，不用
  # continue-on-error 假装绿。
  plugins-windows:
    name: plugins-windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 安装 Rust（与主 rust job 同版本）
        shell: pwsh
        run: |
          rustup toolchain install "$env:RUST_VERSION" --profile minimal
          rustup default "$env:RUST_VERSION"
          cargo --version
      # 关键：runner 的默认 autocrlf 是实现细节，必须显式设成 true，并删掉已
      # 落盘的示例目录后重新 checkout，才能证明「autocrlf=true 时 .gitattributes
      # 仍然把文本钉成 LF」。只改配置不重新落盘等于没验。
      - name: 强制 autocrlf=true 后重新检出（复现开发机默认）
        shell: pwsh
        run: |
          git config --global core.autocrlf true
          git config --local core.autocrlf true
          "effective core.autocrlf = $(git config --get core.autocrlf)"
          Remove-Item -Recurse -Force plugins/examples
          git checkout -- .
          "effective core.autocrlf after checkout = $(git config --get core.autocrlf)"
          git ls-files --eol plugins/examples
      # 用原始字节判断，不用 Get-Content（后者会做行尾转换，看不出真相）。
      # 3096/2864/607 是评审给出的 LF 字节数，直接对照。
      - name: 断言行尾真的是 LF 且字节数正确（.gitattributes 生效）
        shell: pwsh
        run: |
          $expected = @{
            "plugins/examples/export-diary-markdown/main.wat" = 3096
            "plugins/examples/export-diary-markdown/README.md" = 2864
            "plugins/examples/style-daily-note/main.json" = 607
          }
          $failed = $false
          $textFiles = Get-ChildItem plugins/examples -Recurse -File |
            Where-Object { $_.Extension -ne ".wasm" }
          foreach ($item in $textFiles) {
            $relative = [System.IO.Path]::GetRelativePath((Get-Location).Path, $item.FullName).Replace('\', '/')
            $bytes = [System.IO.File]::ReadAllBytes($item.FullName)
            if ($bytes -contains 13) {
              Write-Error "CRLF 出现在 $relative（$($bytes.Length) B）"
              $failed = $true
            } else {
              Write-Host "$relative OK ($($bytes.Length) B, no CR)"
            }
          }
          foreach ($relative in $expected.Keys) {
            $bytes = [System.IO.File]::ReadAllBytes((Join-Path (Get-Location).Path $relative))
            if ($bytes.Length -ne $expected[$relative]) {
              Write-Error "$relative 字节数 $($bytes.Length) != 期望 $($expected[$relative])"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: 插件包与沙箱测试（Windows 行尾/路径）
        run: cargo test -p diary_core --test plugin_test
        env:
          CARGO_TERM_COLOR: always

  bridge:
    name: bridge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 安装 Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: 构建桥接产物
        run: cargo build --release
      - name: 安装 Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.12.2
      - name: 安装依赖
        working-directory: packages/diary_bridge
        run: dart pub get
      # 生成物与源码必须同源（#148）。改了 `crates/diary_bridge/src/api.rs` 或
      # `crates/diary_core/src/model.rs`、却忘了重跑 codegen 时，`cargo build` 与
      # `dart test` **都还是绿的**：#143 就这么漂了 2 行注释、#153 又漂了一次。
      # 这一步跑真正的 codegen，再要求生成目录逐字节不变——不靠人记 §10.6。
      #
      # **不按 paths 过滤**：codegen 解析的是整个 bridge crate 加 `diary_core::model`
      # 可达的类型图，能改变产物的文件不止 `crates/diary_bridge/**`；而过滤漏掉时的
      # 表现是**静默变绿**，正是这一步要消灭的失败模式。缓存命中时本机实测 +8~15 秒。
      - name: 缓存 codegen 可执行文件
        id: frb-codegen
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: frb-codegen-${{ runner.os }}-${{ runner.arch }}-${{ env.FRB_CODEGEN_VERSION }}
      - name: 安装 codegen（缓存未命中时）
        if: steps.frb-codegen.outputs.cache-hit != 'true'
        run: cargo install flutter_rust_bridge_codegen --version "$FRB_CODEGEN_VERSION" --locked
      - name: codegen 是否同步
        run: bash tools/check_codegen_freshness.sh
      - name: 静态分析
        working-directory: packages/diary_bridge
        run: dart analyze --fatal-infos
      - name: 端到端调用测试
        working-directory: packages/diary_bridge
        run: dart test

  probe:
    name: probe
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 安装 Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: 插件运行时验证（预算与权限必须可强制）
        run: cargo run --release -p diary_probe -- plugin-runtime
      - name: 插件代码的 Android arm64 编译检查
        run: |
          rustup target add aarch64-linux-android
          cargo check --release -p diary_probe --no-default-features --features plugin --target aarch64-linux-android
      - name: 中文短词检索验证（小语料，含结论断言）
        run: cargo run --release -p diary_probe -- short-word-search 3000
      # 质量集只用仓库内的数据（tests/quality/search_quality_set.json），能在 CI 跑。
      # 这一步**不设阈值**：它报的是关键词这一路的基线数字，并且会在语料被改坏
      # （expectedContains 对不上、标注被污染）时直接失败。等 B3c-3 做出混合结果
      # 之后，再谈「提升多少算达标」——现在定阈值只会把刚建的基线锁死。
      - name: 检索质量集（关键词基线，含语料自检）
        run: cargo run --release -p diary_probe -- quality-set
