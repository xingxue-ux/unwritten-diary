name: check

on:
  # 不限制 base 分支：叠在别的 PR 上的分支也要能跑检查。
  # 必过检查只对发往 main 的 PR 生效，这里放宽不会削弱门禁。
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与 Cargo.toml 里的 rust-version 下限一致：CI 必须验最老的受支持版本，
  # 用更新的 stable 会掩盖 MSRV 问题。
  RUST_VERSION: "1.94.1"
  DART_VERSION: "3.12.2"

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 校验关键文件、Markdown 链接、.github YAML 与共用场景
        run: python3 tools/check_docs.py

  dart:
    name: dart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/diary_api
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 安装 Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.12.2
      - name: 安装依赖
        run: dart pub get
      - name: 静态分析
        run: dart analyze --fatal-infos
      - name: 单元测试
        run: dart test

  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 安装 Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup default "$RUST_VERSION"
          cargo --version
      - name: 静态检查
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 单元测试
        run: cargo test --workspace

  bridge:
    name: bridge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 安装 Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: 构建桥接产物
        run: cargo build --release
      - name: 安装 Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.12.2
      - name: 安装依赖
        working-directory: packages/diary_bridge
        run: dart pub get
      - name: 静态分析
        working-directory: packages/diary_bridge
        run: dart analyze --fatal-infos
      - name: 桥接调用探针
        working-directory: packages/diary_bridge
        run: dart test