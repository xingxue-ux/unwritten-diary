name: check

on:
  # 不限制 base 分支：叠在别的 PR 上的分支也要能跑检查。
  # 必过检查只对发往 main 的 PR 生效，这里放宽不会削弱门禁。
  pull_request:
  push:
    branches: [main]
  # 手动触发：ohos-ort 的缓存预热/强制重建都走这里（见下面的 ohos-ort job）。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与 Cargo.toml 里的 rust-version 下限一致：CI 必须验最老的受支持版本，
  # 用更新的 stable 会掩盖 MSRV 问题。
  RUST_VERSION: "1.94.1"
  DART_VERSION: "3.12.2"
  # 与 DART_VERSION 对应的 Flutter 版本（3.44.6 自带 Dart 3.12.2）。
  FLUTTER_VERSION: "3.44.6"

jobs:

  # 只为 ohos-ort 判断「要不要跑」：GitHub 的 paths 过滤只能作用在触发事件上，
  # 不能只过滤某一个 job，所以用一个几秒的 job 先算一次。
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ohos: ${{ steps.diff.outputs.ohos }}
    steps:
      - name: 检出仓库（需要历史才能 diff）
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: 判断变更是否涉及 OHOS 原生 / ORT
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "ohos=true" >> "$GITHUB_OUTPUT"
            echo "手动触发：ohos-ort 会跑（命中缓存则秒级）"
            exit 0
          fi
          changed=""
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]] \
             && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" || true)"
          else
            changed="$(git show --pretty=format: --name-only "$GITHUB_SHA" || true)"
          fi
          if grep -qE '^(probes/ohos-|apps/ohos-|tools/ohos/|\.github/workflows/check\.yml$)' <<<"$changed"; then
            echo "ohos=true" >> "$GITHUB_OUTPUT"
          else
            echo "ohos=false" >> "$GITHUB_OUTPUT"
          fi
          echo "本次变更文件："
          sed 's/^/  /' <<<"$changed"

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 校验关键文件、Markdown 链接、.github YAML 与共用场景
        run: python3 tools/check_docs.py

  dart:
    name: dart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/diary_api
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 安装 Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.12.2
      - name: 安装依赖
        run: dart pub get
      - name: 静态分析
        run: dart analyze --fatal-infos
      - name: 单元测试
        run: dart test
      # F0 的 diary_mock 是纯 Dart，跟着同一个必过检查跑，不新增检查名。
      # 它和 apps/diary_app 一样是 PR #34 才引入的目录，先做存在性判断，
      # 免得本 PR 先合时这一步因为目录不存在直接失败。
      - name: diary_mock 是否存在
        id: mock
        run: |
          # 用绝对路径：这一步继承了任务级 working-directory（packages/diary_api），
          # 相对路径会去 diary_api 里找 diary_mock，永远找不到。
          if [ -f "$GITHUB_WORKSPACE/packages/diary_mock/pubspec.yaml" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::packages/diary_mock 还不存在，跳过它的静态分析与测试"
          fi
      - name: 安装依赖（diary_mock）
        if: steps.mock.outputs.present == 'true'
        working-directory: packages/diary_mock
        run: dart pub get
      - name: 静态分析（diary_mock）
        if: steps.mock.outputs.present == 'true'
        working-directory: packages/diary_mock
        run: dart analyze --fatal-infos
      - name: 单元测试（diary_mock）
        if: steps.mock.outputs.present == 'true'
        working-directory: packages/diary_mock
        run: dart test

  flutter:
    name: flutter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 不用任务级 defaults.working-directory：它同样作用于下面那条存在性判断，
    # 目录不存在时判断本身就会因为工作目录不存在而失败（第一次跑就是这样红的）。
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # apps/diary_app 是 PR #34 才引入的目录。本 PR 可能先于它合入，
      # 那时这个任务什么都不该做——但也不能静默变绿，所以打一条 notice。
      - name: 应用目录是否存在
        id: app
        run: |
          if [ -f "$GITHUB_WORKSPACE/apps/diary_app/pubspec.yaml" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/diary_app 还不存在，跳过本轮 Flutter 检查"
          fi
      - name: 安装 Flutter
        if: steps.app.outputs.present == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 安装依赖
        if: steps.app.outputs.present == 'true'
        working-directory: apps/diary_app
        run: flutter pub get
      - name: 静态分析
        if: steps.app.outputs.present == 'true'
        working-directory: apps/diary_app
        run: flutter analyze --fatal-infos
      - name: 组件测试
        if: steps.app.outputs.present == 'true'
        working-directory: apps/diary_app
        run: flutter test

  platform-host:
    name: platform-host
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/platform_host
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: 3.12.2
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: dart analyze --fatal-infos
      - run: dart test

  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 安装 Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup default "$RUST_VERSION"
          cargo --version
      - name: 静态检查
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 单元测试
        run: cargo test --workspace
      # AI 质量集的**回放**跑法：不联网（回放引擎不碰 Transport），秒级完成。
      # 它守的是「判定器 + 质量集 + 报表 + 门禁」四者对得上——回放数字**不是质量基线**，
      # 真模型基线要手动跑并如实记录（见 docs/architecture/m3-AI-质量集与评测.md）。
      #
      # **这一步的退出码就是门禁**（评审 #99）：有非预期失败项时 CLI 以非零退出码结束，
      # 这一步跟着红。未判 / 不适用不算失败；质量集里声明过的负例（tr-04 / tr-06，
      # `expect.replayVerdict = "fail"`）按预期失败，不算失败——但它们要是不红了，
      # 说明判据丢了区分度，同样红。
      - name: AI 质量集（回放，不联网）
        run: cargo run -p diary_probe -- ai-quality --json /tmp/ai-quality-replay-baseline.json

  bridge:
    name: bridge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 安装 Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: 构建桥接产物
        run: cargo build --release
      - name: 安装 Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.12.2
      - name: 安装依赖
        working-directory: packages/diary_bridge
        run: dart pub get
      - name: 静态分析
        working-directory: packages/diary_bridge
        run: dart analyze --fatal-infos
      - name: 端到端调用测试
        working-directory: packages/diary_bridge
        run: dart test

  probe:
    name: probe
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 安装 Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: 插件运行时验证（预算与权限必须可强制）
        run: cargo run --release -p diary_probe -- plugin-runtime
      - name: 插件代码的 Android arm64 编译检查
        run: |
          rustup target add aarch64-linux-android
          cargo check --release -p diary_probe --no-default-features --features plugin --target aarch64-linux-android
      - name: 中文短词检索验证（小语料，含结论断言）
        run: cargo run --release -p diary_probe -- short-word-search 3000
      # 质量集只用仓库内的数据（tests/quality/search_quality_set.json），能在 CI 跑。
      # 这一步**不设阈值**：它报的是关键词这一路的基线数字，并且会在语料被改坏
      # （expectedContains 对不上、标注被污染）时直接失败。等 B3c-3 做出混合结果
      # 之后，再谈「提升多少算达标」——现在定阈值只会把刚建的基线锁死。
      - name: 检索质量集（关键词基线，含语料自检）
        run: cargo run --release -p diary_probe -- quality-set

  # 可选 job：把自编 ORT 1.29.1（OHOS/aarch64）变成**可缓存、可复现**的产物。
  #
  # ★ 它**不是** main 的必需检查（分支保护里不要勾它）：缓存未命中时要 ~33 min/16 核，
  #   不该卡住所有人的 PR；而且 GitHub hosted runner 上没有 OHOS NDK，首次只能靠
  #   手动 dispatch + 自托管 runner / 仓库变量 OHOS_CLT_URL 来预热缓存。
  #   命中缓存后它只做「复制 + 自检」，几秒结束。
  #
  # 触发：只有 probes/ohos-*/**、apps/ohos-*/**、tools/ohos/**、本 workflow 变更，
  #       或 workflow_dispatch 时才跑（由上面的 changes job 判定）。
  ohos-ort:
    name: ohos-ort
    needs: changes
    if: needs.changes.outputs.ohos == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ORT_VERSION: "1.29.1"
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 指定 ORT 缓存目录（与脚本默认值不同，只为了把缓存路径收在 ~/.cache）
        run: |
          set -euo pipefail
          echo "ORT_CACHE_DIR=$HOME/.cache/dsh-ort/ort-${ORT_VERSION//./}" >> "$GITHUB_ENV"
      - name: 恢复 ORT 产物缓存
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/dsh-ort
          # key 里必须有 ORT 版本 + 构建脚本内容：脚本一改（补丁/参数/自检变了），
          # 旧产物虽然还能用，但应该让 CI 重新编一次来验证脚本本身。
          key: ort-${{ env.ORT_VERSION }}-${{ runner.os }}-${{ hashFiles('tools/ohos/build-ort.sh', 'tools/ohos/ort_source_edits.py') }}-v1
      - name: 缓存命中 → 复用 + 自检（秒级，不需要 NDK）
        if: steps.cache.outputs.cache-hit == 'true'
        run: tools/ohos/build-ort.sh
      - name: 缓存未命中 → 准备 NDK（没有就 fail-fast 并给指引）
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          OHOS_CLT_URL: ${{ vars.OHOS_CLT_URL }}
          OHOS_CLT_SHA256: ${{ vars.OHOS_CLT_SHA256 }}
        run: |
          set -euo pipefail
          ndk="${NDK:-$HOME/command-line-tools/sdk/default/openharmony/native}"
          if [[ -d "$ndk" ]]; then
            echo "复用 runner 上已有的 NDK：$ndk"
            echo "NDK=$ndk" >> "$GITHUB_ENV"
            exit 0
          fi
          if [[ -z "${OHOS_CLT_URL:-}" ]]; then
            echo "::error::ORT 缓存未命中，且这个 runner 上没有 OHOS NDK —— 33 min 的构建跑不了"
            cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ohos-ort：缓存未命中，且没有 OHOS NDK

          这个 job 是**可选**的，不影响 main 的必需检查。要让它真正构建，任选一条：

          1. **自托管 runner**：装好 Command Line Tools，NDK 在
             `~/command-line-tools/sdk/default/openharmony/native`，然后手动 dispatch 一次
             （会把产物写入 Actions 缓存，之后 hosted runner 命中缓存只需几秒）。
          2. **仓库变量**：设 `OHOS_CLT_URL` 指向 Command Line Tools（linux-x64）压缩包的
             可下载地址，建议同时设 `OHOS_CLT_SHA256`。job 会自动解压并找到
             `*/openharmony/native`。
          3. **只在本地编**：`tools/ohos/build-ort.sh --force-build`，再把
             `$HOME/dev/caches/ort-1291` 按 `~/.cache/dsh-ort/ort-1291` 的结构预热缓存。

          配方、踩过的坑与缓存失效条件见 `docs/architecture/m6-ORT-构建与缓存.md`。
          EOF
            exit 1
          fi
          echo "下载 Command Line Tools：$OHOS_CLT_URL"
          dest="$HOME/ohos-clt"
          mkdir -p "$dest"
          archive="$dest/command-line-tools.tar.gz"
          curl -fL --retry 3 -o "$archive" "$OHOS_CLT_URL"
          if [[ -n "${OHOS_CLT_SHA256:-}" ]]; then
            echo "$OHOS_CLT_SHA256  $archive" | sha256sum -c -
          else
            echo "::warning::没有设 OHOS_CLT_SHA256，跳过压缩包校验"
          fi
          tar -xzf "$archive" -C "$dest"
          ndk="$(find "$dest" -type d -path '*/openharmony/native' -print -quit)"
          [[ -n "$ndk" ]] || { echo "::error::压缩包里没找到 */openharmony/native"; exit 1; }
          echo "NDK=$ndk" >> "$GITHUB_ENV"
      - name: 缓存未命中 → 完整构建（首次 ~33 min / 16 核）
        if: steps.cache.outputs.cache-hit != 'true'
        run: tools/ohos/build-ort.sh --force-build
