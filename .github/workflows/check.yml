name: check

on:
  # 不限制 base 分支：叠在别的 PR 上的分支也要能跑检查。
  # 必过检查只对发往 main 的 PR 生效，这里放宽不会削弱门禁。
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与 Cargo.toml 里的 rust-version 下限一致：CI 必须验最老的受支持版本，
  # 用更新的 stable 会掩盖 MSRV 问题。
  RUST_VERSION: "1.94.1"
  DART_VERSION: "3.12.2"
  # 与 DART_VERSION 对应的 Flutter 版本（3.44.6 自带 Dart 3.12.2）。
  FLUTTER_VERSION: "3.44.6"

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 校验关键文件、Markdown 链接、.github YAML 与共用场景
        run: python3 tools/check_docs.py

  dart:
    name: dart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/diary_api
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 安装 Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.12.2
      - name: 安装依赖
        run: dart pub get
      - name: 静态分析
        run: dart analyze --fatal-infos
      - name: 单元测试
        run: dart test
      # F0 的 diary_mock 是纯 Dart，跟着同一个必过检查跑，不新增检查名。
      # 它和 apps/diary_app 一样是 PR #34 才引入的目录，先做存在性判断，
      # 免得本 PR 先合时这一步因为目录不存在直接失败。
      - name: diary_mock 是否存在
        id: mock
        run: |
          if [ -f packages/diary_mock/pubspec.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::packages/diary_mock 还不存在，跳过它的静态分析与测试"
          fi
      - name: 安装依赖（diary_mock）
        if: steps.mock.outputs.present == 'true'
        working-directory: packages/diary_mock
        run: dart pub get
      - name: 静态分析（diary_mock）
        if: steps.mock.outputs.present == 'true'
        working-directory: packages/diary_mock
        run: dart analyze --fatal-infos
      - name: 单元测试（diary_mock）
        if: steps.mock.outputs.present == 'true'
        working-directory: packages/diary_mock
        run: dart test

  flutter:
    name: flutter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 不用任务级 defaults.working-directory：它同样作用于下面那条存在性判断，
    # 目录不存在时判断本身就会因为工作目录不存在而失败（第一次跑就是这样红的）。
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # apps/diary_app 是 PR #34 才引入的目录。本 PR 可能先于它合入，
      # 那时这个任务什么都不该做——但也不能静默变绿，所以打一条 notice。
      - name: 应用目录是否存在
        id: app
        run: |
          if [ -f apps/diary_app/pubspec.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/diary_app 还不存在，跳过本轮 Flutter 检查"
          fi
      - name: 安装 Flutter
        if: steps.app.outputs.present == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 安装依赖
        if: steps.app.outputs.present == 'true'
        working-directory: apps/diary_app
        run: flutter pub get
      - name: 静态分析
        if: steps.app.outputs.present == 'true'
        working-directory: apps/diary_app
        run: flutter analyze --fatal-infos
      - name: 组件测试
        if: steps.app.outputs.present == 'true'
        working-directory: apps/diary_app
        run: flutter test

  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 安装 Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup default "$RUST_VERSION"
          cargo --version
      - name: 静态检查
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 单元测试
        run: cargo test --workspace

  bridge:
    name: bridge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 安装 Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: 构建桥接产物
        run: cargo build --release
      - name: 安装 Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.12.2
      - name: 安装依赖
        working-directory: packages/diary_bridge
        run: dart pub get
      - name: 静态分析
        working-directory: packages/diary_bridge
        run: dart analyze --fatal-infos
      - name: 桥接调用探针
        working-directory: packages/diary_bridge
        run: dart test

  probe:
    name: probe
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 安装 Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: 插件运行时验证（预算与权限必须可强制）
        run: cargo run --release -p diary_probe -- plugin-runtime
      - name: 插件代码的 Android arm64 编译检查
        run: |
          rustup target add aarch64-linux-android
          cargo check --release -p diary_probe --no-default-features --features plugin --target aarch64-linux-android
      - name: 中文短词检索验证（小语料，含结论断言）
        run: cargo run --release -p diary_probe -- short-word-search 3000