name: 任务认领
description: 认领一个任务（F0–F8 / B0–B8 或计划外的具体工作）。提完把自己设为 Assignee 再开工。
title: "[F0] "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        我们不预设分工：任何任务谁都可以认领，同一个人也可以做前端层和后端层的任务。

        认领规则见 [CONTRIBUTING.md](https://github.com/xingxue-ux/unwritten-diary/blob/main/CONTRIBUTING.md) 第 1 节。**开工前请先做一次撞车检查**：打开所有 open PR，看它们的改动文件里有没有你要动的文件。

  - type: input
    id: task_id
    attributes:
      label: 任务编号
      description: 用计划文档里的编号；计划外的工作写「无」
      placeholder: F2 / B3 / 无
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: 所属层
      description: 这是代码层，不是人；两层都由同一个人做也可以
      options:
        - 前端层
        - 后端层
        - 跨层
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 要交付什么
      description: 一句话说清完成的样子，不要写"完成 F2"
      placeholder: 记录页可以把文字、录音、附件追加到同一条记录，断网也能保存
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: 预计改动的文件或目录
      description: 供对方判断是否撞车；开工后发现范围变化，回来编辑本 issue
      placeholder: |
        apps/diary_app/lib/features/capture/**
        packages/diary_mock/lib/capture_mock.dart
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 引用《04-验收与测试计划》里的案例编号；没有对应案例就自己写可验证的判定条件
      placeholder: E02、E06、E08；真机断网保存后重启原文一致
    validations:
      required: true

  - type: input
    id: deps
    attributes:
      label: 依赖的任务
      description: 需要先完成的其他任务或 issue 编号；没有写「无」
      placeholder: B1 类型包 / #12
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: 明确不做
      description: 划清本次范围，避免 PR 膨胀
      placeholder: 不做插件宿主，不做备份恢复
    validations:
      required: false

  - type: checkboxes
    id: ack
    attributes:
      label: 认领确认
      options:
        - label: 我已读过 `01-共享接口契约.md`，以及本任务对应的任务书
          required: true
        - label: 我已检查 open PR，没有与别人同时改同一个文件
          required: true
        - label: 我不会为了绕过接口缺口，在页面或插件里直接访问数据库、原生对象或模型服务 HTTP API
          required: true
        - label: 我不会手改生成代码；需要重新生成时会在同一个 PR 里提交
          required: true