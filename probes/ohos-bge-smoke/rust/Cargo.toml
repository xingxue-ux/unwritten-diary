[package]
name = "diary_bge_core"
version = "0.1.0"
edition = "2021"
publish = false

# ⚠️ 这个空 `[workspace]` 段是必需的：探针 crate 位于产品仓库目录树里，但**不能**进产品
# workspace（根 `Cargo.toml` 的 members 是显式列表）。声明自己的 workspace 根之后
# cargo 既不会把它算进产品 workspace，也不会报 "believes it's in a workspace when it's not"。
# 效果：`crates/**` 零改动。
[workspace]

[lib]
name = "diary_bge_core"
# cdylib 给 HAP 里的 C++ NAPI shim dlopen；rlib 让 `cargo test` 能在宿主上跑同一段 run()。
crate-type = ["cdylib", "rlib"]

[dependencies]
# 产品核心：**只依赖，不改一行**。探针走的 `diary_core::embedding::load` +
# `Embedder::embed_document` 就是产品语义检索用的那条路径（CLS pooling、无查询前缀、512 维）。
diary_core = { path = "../../../crates/diary_core" }
# 与 diary_core 依赖的**同一个** `ort`（load-dynamic）。这里只用在第 7 步：
# 单独量一次「建会话」的耗时，把 load_ms 拆开看。
ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic", "std"] }
serde_json = "1"
# 与 diary_core 依赖的同一个 crate：这里只用来数 token（证明语料长度、长文本是否越界）。
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
sha2 = "0.10"

# 与产品 workspace 的 `[profile.release]` 保持一致（opt-level=z + LTO + strip），
# 这样报出来的 .so 体积就是同口径可比的。
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true