[package]
name = "diary_core_smoke"
version = "0.1.0"
edition = "2021"
publish = false

# ⚠️ 这个空 `[workspace]` 段是必需的：探针 crate 位于产品仓库目录树里，但**不能**进产品
# workspace（根 `Cargo.toml` 的 members 是显式列表）。声明自己的 workspace 根之后
# cargo 既不会把它算进产品 workspace，也不会报 "believes it's in a workspace when it's not"。
# 效果：`crates/**` 零改动，探针自己的 `[profile.release]` 也生效。
[workspace]

[lib]
name = "diary_core_smoke"
# 只出 cdylib（.so），给 HAP 里的 C++ NAPI shim dlopen。
crate-type = ["cdylib"]

[dependencies]
# 产品核心：**只依赖，不改一行**。
diary_core = { path = "../../../crates/diary_core" }
# 裸 SQLite 对照实验（与产品同一个 bundled SQLite 源码）。
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1"
# 产品**真实**的 ORT 接入方式（load-dynamic）：用来验「我们这版 ort crate 能不能用
# 设备上那个 libonnxruntime.so」。与 diary_core 依赖的是同一个 crate，不会重复编译。
ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic", "std"] }
sha2 = "0.10"

# 与产品 workspace 的 `[profile.release]` 保持一致（opt-level=z + LTO + strip），
# 这样报出来的 .so 体积就是同口径可比的。
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true