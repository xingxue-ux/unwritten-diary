name: unwritten_diary
description: 不写日记的 Windows/Android Flutter 客户端
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  diary_api:
    path: ../../packages/diary_api
  diary_mock:
    path: ../../packages/diary_mock
  diary_bridge:
    path: ../../packages/diary_bridge
  flutter_timezone: ^5.1.1
  path: ^1.9.1
  path_provider: ^2.1.6
  workmanager: ^0.10.10
  file_selector: ^1.1.0
  platform_host:
    path: ../../packages/platform_host
  ui_strings:
    path: ../../packages/ui_strings

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # 共享文案表 packages/ui_strings/ui_strings.json 由 path 依赖 `ui_strings`
    # 以 package asset 提供，bundle key 是 packages/ui_strings/ui_strings.json。
    # 不在这里重复列一份：Flutter 的 package asset 只从包内 lib/ 解析，
    # 在这里列 packages/ui_strings/... 会报 "No file or variants found"。
    - assets/brand/app_icon.png
    # Third-party license texts and notices travel with the binary. Keeping
    # them as Flutter assets puts them in the APK/AAB and in the Windows
    # data/flutter_assets tree; release scripts also copy them beside the app.
    - assets/legal/
    - assets/fonts/OFL.txt
  fonts:
    - family: DiaryDisplay
      fonts:
        - asset: assets/fonts/DiaryDisplay-AppSubset.ttf
